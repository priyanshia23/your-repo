services:
  - type: web                          # must be "web" to receive HTTP requests from Slack
    name: slack-thread-sync
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn slack_thread_sync:app
    plan: free                         # upgrade to "starter" ($7/mo) for no sleep
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SLACK_TOKEN
        sync: false                    # set manually in Render dashboard
      - key: AIRTABLE_TOKEN
        sync: false                    # set manually in Render dashboard
      - key: AIRTABLE_BASE_ID
        sync: false
      - key: AIRTABLE_TABLE_NAME
        sync: false
